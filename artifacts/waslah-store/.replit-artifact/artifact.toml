kind = "web"
previewPath = "/waslah/"
title = "Waslah Tech Store"
description = "A focused electronics storefront for Waslah's curated Vention shortlist, with retail reference pricing, product filtering, quote requests, and bundle-ready shopping interactions."
version = "1.0.0"
id = "artifacts/waslah-store"
router = "path"

[[services]]
name = "web"
paths = [ "/waslah/" ]
localPort = 21096

[services.development]
run = "pnpm --filter @workspace/waslah-store run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/waslah-store", "run", "build" ]
serve = "static"
publicDir = "artifacts/waslah-store/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "21096"
BASE_PATH = "/waslah/"
