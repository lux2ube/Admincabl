kind = "web"
previewPath = "/"
title = "Namshi Store Clone"
description = "A faithful, editable React storefront recreation based on the supplied Namshi reference page, with browse, search, cart, and wishlist interactions."
version = "1.0.0"
id = "artifacts/namshi-store"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 26002

[services.development]
run = "pnpm --filter @workspace/namshi-store run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/namshi-store", "run", "build" ]
serve = "static"
publicDir = "artifacts/namshi-store/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "26002"
BASE_PATH = "/"
