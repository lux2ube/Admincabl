kind = "web"
previewPath = "/cabl-reference-store/"
title = "CABL Reference Store"
description = "A new Arabic RTL CABL storefront artifact with specialized home, category, brand, product, and checkout pages based on the supplied reference HTML, powered by the existing seeded catalog and order API."
version = "1.0.0"
id = "artifacts/cabl-reference-store"
router = "path"

[[services]]
name = "web"
paths = [ "/cabl-reference-store/" ]
localPort = 20675

[services.development]
run = "pnpm --filter @workspace/cabl-reference-store run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/cabl-reference-store", "run", "build" ]
serve = "static"
publicDir = "artifacts/cabl-reference-store/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "20675"
BASE_PATH = "/cabl-reference-store/"
