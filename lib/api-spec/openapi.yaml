openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: sourcing
    description: CABL sourcing and newsletter operations
  - name: admin
    description: CABL administration and catalog operations
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /quote-requests:
    post:
      operationId: createQuoteRequest
      tags: [sourcing]
      summary: Create a wholesale quote request
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/QuoteRequestInput"
      responses:
        "201":
          description: Quote request created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QuoteRequest"
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /newsletter-subscriptions:
    post:
      operationId: subscribeNewsletter
      tags: [sourcing]
      summary: Subscribe an email address to CABL updates
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NewsletterSubscriptionInput"
      responses:
        "201":
          description: Newsletter subscription created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NewsletterSubscription"
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /store/catalog:
    get:
      operationId: getStoreCatalog
      tags: [store]
      summary: Get the published CABL catalog
      responses:
        "200":
          description: Published products with gallery and shipping options
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StoreCatalog"
  /store/seo:
    get:
      operationId: getStoreSeo
      tags: [store]
      summary: Get generated SEO metadata for a public CABL route
      parameters:
        - name: type
          in: query
          required: true
          schema:
            type: string
            enum: [home, product, category, brand, guide]
        - name: slug
          in: query
          required: false
          schema:
            type: string
            pattern: "^[a-z0-9-]+$"
            maxLength: 180
      responses:
        "200":
          description: Generated SEO metadata and structured data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StoreSeoResponse"
        "400":
          description: Invalid SEO route request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: SEO entity not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /store/orders:
    get:
      operationId: listStoreOrders
      tags: [store]
      summary: List a customer's orders using verified contact details
      parameters:
        - name: email
          in: query
          required: true
          schema:
            type: string
            pattern: "^[^\\s@]+@[^\\s@]+\\.[^\\s@]+$"
        - name: phone
          in: query
          required: true
          schema:
            type: string
            minLength: 5
            maxLength: 40
      responses:
        "200":
          description: Customer order history
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StoreOrders"
        "400":
          description: Invalid contact details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    post:
      operationId: createStoreOrder
      tags: [store]
      summary: Create a customer order and its line items
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StoreOrderInput"
      responses:
        "201":
          description: Order created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StoreOrder"
        "400":
          description: Invalid order or unavailable inventory
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /store/orders/{id}:
    get:
      operationId: getStoreOrder
      tags: [store]
      summary: Get one order using the customer's phone number
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: phone
          in: query
          required: true
          schema:
            type: string
            minLength: 5
            maxLength: 40
      responses:
        "200":
          description: Order details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StoreOrder"
        "404":
          description: Order not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /admin/metadata:
    get:
      operationId: getAdminMetadata
      tags: [admin]
      summary: Get admin tables and relationships
      responses:
        "200":
          description: Admin metadata
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminMetadata"
  /admin/dashboard:
    get:
      operationId: getAdminDashboard
      tags: [admin]
      summary: Get admin dashboard summary
      responses:
        "200":
          description: Dashboard summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminDashboard"
  /admin/tables/{table}/rows:
    get:
      operationId: listAdminRows
      tags: [admin]
      summary: List rows for an allowed admin table
      parameters:
        - $ref: "#/components/parameters/AdminTable"
        - name: search
          in: query
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: number
            minimum: 1
            maximum: 100
            default: 25
        - name: offset
          in: query
          schema:
            type: number
            minimum: 0
            default: 0
      responses:
        "200":
          description: Table rows
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminRows"
        "404":
          description: Unknown table
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    post:
      operationId: createAdminRow
      tags: [admin]
      summary: Create a row in an allowed admin table
      parameters:
        - $ref: "#/components/parameters/AdminTable"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminRowInput"
      responses:
        "201":
          description: Created row
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminRow"
        "400":
          description: Invalid row
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /admin/tables/{table}/rows/{id}:
    patch:
      operationId: updateAdminRow
      tags: [admin]
      summary: Update a row in an allowed admin table
      parameters:
        - $ref: "#/components/parameters/AdminTable"
        - $ref: "#/components/parameters/AdminRowId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminRowInput"
      responses:
        "200":
          description: Updated row
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminRow"
        "400":
          description: Invalid row
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Row not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      operationId: deleteAdminRow
      tags: [admin]
      summary: Delete a row from an allowed admin table
      parameters:
        - $ref: "#/components/parameters/AdminTable"
        - $ref: "#/components/parameters/AdminRowId"
      responses:
        "204":
          description: Row deleted
        "400":
          description: Delete blocked by a relationship
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Row not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /admin/seed:
    post:
      operationId: seedAdminData
      tags: [admin]
      summary: Seed CABL catalog and reference data
      responses:
        "200":
          description: Seed summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminSeedResult"
        "500":
          description: Seed failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
components:
  parameters:
    AdminTable:
      name: table
      in: path
      required: true
      schema:
        type: string
    AdminRowId:
      name: id
      in: path
      required: true
      schema:
        type: string
  schemas:
    StoreShippingOption:
      type: object
      properties:
        id:
          type: number
        name:
          type: string
        charge:
          type: number
        free:
          type: boolean
        estimatedDays:
          type: ["number", "null"]
      required: [id, name, charge, free, estimatedDays]
    StorePaymentMethod:
      type: object
      properties:
        id:
          type: number
        name:
          type: string
        description:
          type: ["string", "null"]
        accountName:
          type: ["string", "null"]
        accountNumber:
          type: ["string", "null"]
        instructions:
          type: ["string", "null"]
        iconKey:
          type: string
        requiresTransactionReference:
          type: boolean
      required: [id, name, description, accountName, accountNumber, instructions, iconKey, requiresTransactionReference]
    StoreProduct:
      type: object
      properties:
        id:
          type: string
        slug:
          type: string
        brand:
          type: string
        brandSlug:
          type: ["string", "null"]
        productName:
          type: string
        sku:
          type: string
        regularPrice:
          type: number
        discountPrice:
          type: ["number", "null"]
        quantity:
          type: number
        shortDescription:
          type: ["string", "null"]
        productDescription:
          type: ["string", "null"]
        productNote:
          type: ["string", "null"]
        category:
          type: ["object", "null"]
          properties:
            id:
              type: string
            name:
              type: string
            slug:
              type: string
          required: [id, name, slug]
        images:
          type: array
          items:
            type: string
        shippingOptions:
          type: array
          items:
            $ref: "#/components/schemas/StoreShippingOption"
      required: [id, slug, brand, brandSlug, productName, sku, regularPrice, discountPrice, quantity, shortDescription, productDescription, productNote, category, images, shippingOptions]
    StoreSeoBreadcrumb:
      type: object
      properties:
        name:
          type: string
        path:
          type: string
      required: [name, path]
    StoreSeoResponse:
      type: object
      properties:
        entityType:
          type: string
          enum: [home, product, category, brand, guide]
        slug:
          type: ["string", "null"]
        title:
          type: string
        h1:
          type: string
        description:
          type: string
        canonicalPath:
          type: string
        indexable:
          type: boolean
        breadcrumbs:
          type: array
          items:
            $ref: "#/components/schemas/StoreSeoBreadcrumb"
        jsonLd:
          type: object
          additionalProperties: true
      required: [entityType, slug, title, h1, description, canonicalPath, indexable, breadcrumbs, jsonLd]
    StoreCatalog:
      type: object
      properties:
        products:
          type: array
          items:
            $ref: "#/components/schemas/StoreProduct"
        shippingOptions:
          type: array
          items:
            $ref: "#/components/schemas/StoreShippingOption"
        paymentMethods:
          type: array
          items:
            $ref: "#/components/schemas/StorePaymentMethod"
        currencies:
          type: array
          items:
            $ref: "#/components/schemas/StoreCurrency"
      required: [products, shippingOptions, paymentMethods, currencies]
    StoreCurrency:
      type: object
      properties:
        code:
          type: string
        name:
          type: string
        ratePerUsd:
          type: number
        isDefault:
          type: boolean
      required: [code, name, ratePerUsd, isDefault]
    StoreOrderItemInput:
      type: object
      properties:
        productId:
          type: string
        quantity:
          type: number
          minimum: 1
          maximum: 99
      required: [productId, quantity]
    StoreOrderCustomer:
      type: object
      properties:
        firstName:
          type: string
          minLength: 2
          maxLength: 100
        lastName:
          type: string
          minLength: 2
          maxLength: 100
        email:
          type: string
          pattern: "^[^\\s@]+@[^\\s@]+\\.[^\\s@]+$"
          maxLength: 255
        phoneNumber:
          type: string
          minLength: 5
          maxLength: 40
      required: [firstName, lastName, email, phoneNumber]
    StoreOrderAddress:
      type: object
      properties:
        addressLine1:
          type: string
          minLength: 3
          maxLength: 500
        addressLine2:
          type: ["string", "null"]
          maxLength: 500
        postalCode:
          type: ["string", "null"]
          maxLength: 50
        country:
          type: string
          minLength: 2
          maxLength: 100
        city:
          type: string
          minLength: 2
          maxLength: 100
        phoneNumber:
          type: ["string", "null"]
          maxLength: 40
      required: [addressLine1, addressLine2, postalCode, country, city, phoneNumber]
    StoreOrderInput:
      type: object
      properties:
        customer:
          $ref: "#/components/schemas/StoreOrderCustomer"
        address:
          $ref: "#/components/schemas/StoreOrderAddress"
        items:
          type: array
          minItems: 1
          maxItems: 50
          items:
            $ref: "#/components/schemas/StoreOrderItemInput"
        shippingId:
          type: number
          minimum: 1
        paymentMethodId:
          type: number
          minimum: 1
        paymentReference:
          type: ["string", "null"]
          maxLength: 255
        couponCode:
          type: ["string", "null"]
          maxLength: 255
      required: [customer, address, items, shippingId, paymentMethodId, paymentReference, couponCode]
    StoreOrder:
      type: object
      properties:
        id:
          type: string
        status:
          type: string
        subtotal:
          type: number
        shippingCost:
          type: number
        discount:
          type: number
        total:
          type: number
        paymentMethodName:
          type: string
        paymentStatus:
          type: string
        paymentReference:
          type: ["string", "null"]
        createdAt:
          type: string
          format: date-time
        items:
          type: array
          items:
            type: object
            properties:
              productId:
                type: string
              productName:
                type: string
              quantity:
                type: number
              price:
                type: number
            required: [productId, productName, quantity, price]
      required: [id, status, subtotal, shippingCost, discount, total, paymentMethodName, paymentStatus, paymentReference, createdAt, items]
    StoreOrderSummary:
      type: object
      properties:
        id:
          type: string
        status:
          type: string
        total:
          type: number
        createdAt:
          type: string
          format: date-time
      required: [id, status, total, createdAt]
    StoreOrders:
      type: object
      properties:
        orders:
          type: array
          items:
            $ref: "#/components/schemas/StoreOrderSummary"
      required: [orders]
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    QuoteRequestItem:
      type: object
      properties:
        productId:
          type: number
          minimum: 1
        productName:
          type: string
          minLength: 1
        sku:
          type: ["string", "null"]
        quantity:
          type: number
          minimum: 1
      required:
        - productId
        - productName
        - sku
        - quantity
    QuoteRequestInput:
      type: object
      properties:
        customerName:
          type: string
          minLength: 2
          maxLength: 120
        phone:
          type: string
          minLength: 5
          maxLength: 40
        businessName:
          type: ["string", "null"]
          maxLength: 160
        notes:
          type: ["string", "null"]
          maxLength: 1000
        items:
          type: array
          maxItems: 50
          items:
            $ref: "#/components/schemas/QuoteRequestItem"
      required:
        - customerName
        - phone
        - businessName
        - notes
        - items
    QuoteRequest:
      type: object
      properties:
        id:
          type: number
        status:
          type: string
          enum: [received]
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - status
        - createdAt
    NewsletterSubscriptionInput:
      type: object
      properties:
        email:
          type: string
          pattern: "^[^\\s@]+@[^\\s@]+\\.[^\\s@]+$"
          maxLength: 254
      required:
        - email
    NewsletterSubscription:
      type: object
      properties:
        id:
          type: number
        status:
          type: string
          enum: [subscribed]
      required:
        - id
        - status
    ErrorResponse:
      type: object
      properties:
        error:
          type: string
      required:
        - error
    AdminColumn:
      type: object
      properties:
        key:
          type: string
        label:
          type: string
        type:
          type: string
          enum: [text, number, boolean, date, uuid, json, array]
        nullable:
          type: boolean
        primaryKey:
          type: boolean
        generated:
          type: boolean
        references:
          type: ["string", "null"]
      required: [key, label, type, nullable, primaryKey, generated, references]
    AdminRelation:
      type: object
      properties:
        column:
          type: string
        targetTable:
          type: string
        targetColumn:
          type: string
        kind:
          type: string
          enum: [belongs_to, has_many, many_to_many, parent]
        label:
          type: string
      required: [column, targetTable, targetColumn, kind, label]
    AdminTable:
      type: object
      properties:
        key:
          type: string
        label:
          type: string
        group:
          type: string
        primaryKey:
          type: string
        columns:
          type: array
          items:
            $ref: "#/components/schemas/AdminColumn"
        relations:
          type: array
          items:
            $ref: "#/components/schemas/AdminRelation"
      required: [key, label, group, primaryKey, columns, relations]
    AdminMetadata:
      type: object
      properties:
        tables:
          type: array
          items:
            $ref: "#/components/schemas/AdminTable"
      required: [tables]
    AdminRows:
      type: object
      properties:
        table:
          type: string
        rows:
          type: array
          items:
            type: object
            additionalProperties: true
        total:
          type: number
      required: [table, rows, total]
    AdminRowInput:
      type: object
      properties:
        values:
          type: object
          additionalProperties: true
      required: [values]
    AdminRow:
      type: object
      properties:
        row:
          type: object
          additionalProperties: true
      required: [row]
    AdminTableCount:
      type: object
      properties:
        table:
          type: string
        label:
          type: string
        count:
          type: number
      required: [table, label, count]
    AdminDashboard:
      type: object
      properties:
        totalRows:
          type: number
        tableCounts:
          type: array
          items:
            $ref: "#/components/schemas/AdminTableCount"
        recentOrders:
          type: array
          items:
            type: object
            additionalProperties: true
      required: [totalRows, tableCounts, recentOrders]
    AdminSeedResult:
      type: object
      properties:
        seeded:
          type: boolean
        inserted:
          type: number
        tables:
          type: object
          additionalProperties:
            type: number
      required: [seeded, inserted, tables]

